name: Source validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          python -m pip install \
            requests==2.32.3 \
            pymongo==4.11.1 \
            ruff==0.16.4 \
            mypy==2.3.1 \
            types-requests==2.33.0.20260712

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

      - name: Run Ruff
        run: ruff check --no-cache .

      - name: Run strict mypy
        run: >-
          mypy --strict
          --no-incremental
          --python-version "${{ matrix.python-version }}"
          src tests

      - name: Compile sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q src tests

      - name: Check indentation
        run: python -m tabnanny src tests

      - name: Check tracked whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(("git", "ls-files", "-z")).split(b"\0")
          findings = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              content = path.read_bytes()
              for line_number, line in enumerate(content.splitlines(), start=1):
                  if line.endswith((b" ", b"\t")):
                      findings.append(f"{path}:{line_number}: trailing whitespace")
              if content and not content.endswith(b"\n"):
                  findings.append(f"{path}: missing final newline")
          if findings:
              raise SystemExit("\n".join(findings))
          PY

      - name: Check diff and clean worktree
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
